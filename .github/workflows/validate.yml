name: Validate
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check public/app.js
      - run: npm start &
      - run: sleep 2 && curl -fsS http://127.0.0.1:3000/api/health
