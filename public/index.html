<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3U Collector Web</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="shell"><header><div><h1>M3U Collector</h1><p>Gerenciador web baseado nas funções do V5.2</p></div><span id="status" class="pill">Pronto</span></header>
<section class="card"><h2>1. Servidores</h2><div id="servers"></div><div class="actions"><button id="addServer">+ Adicionar servidor</button><button id="test">Testar conexão</button></div></section>
<section class="card"><h2>2. Coleta</h2><div class="grid"><label>Tipo<select id="type"><option value="live">Canais</option><option value="vod">Filmes</option><option value="series">Séries</option></select></label><label>Filtro<input id="filter" placeholder="Nome ou grupo"></label></div><div class="actions"><button id="collect" class="primary">Coletar</button><button id="selectAll">Selecionar todos</button><button id="clear">Limpar</button></div></section>
<section class="card"><h2>3. Playlist</h2><div id="stats">Nenhum item carregado.</div><div id="list" class="list"></div><div class="actions"><button id="download" class="primary">Baixar M3U</button></div></section>
</div><script src="/app.js"></script></body></html>
